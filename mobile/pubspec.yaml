name: smart_course_scheduler
description: "Smart Course Scheduler - Aplikasi Penjadwalan Mata Kuliah Cerdas"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: ^0.20.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  http: ^1.2.0
  encrypt: ^5.0.3
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/onboarding/
    - assets/images/profiles/
    - assets/images/dashboard/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/iconaplikasi.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/iconaplikasi.png"
  web:
    generate: true
    image_path: "assets/logo/iconaplikasi.png"
    background_color: "#FFFFFF"
    theme_color: "#1E3A8A"
  windows:
    generate: true
    image_path: "assets/logo/iconaplikasi.png"
    icon_size: 48

